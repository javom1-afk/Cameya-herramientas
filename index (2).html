<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico rápido de Cameya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F3EA;
    --surface:#FFFFFF;
    --ink:#1F3B34;
    --ink-soft:#5B7268;
    --teal:#2F6E5C;
    --teal-dark:#1B3F34;
    --teal-tint:#E5EFE9;
    --gold:#D9A441;
    --gold-tint:#FBF1DE;
    --clay:#C15B3E;
    --clay-tint:#F7E6DF;
    --border:#E5DCC7;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}
  header.top{margin-bottom:28px;}
  .brand{
    display:flex;align-items:center;gap:8px;
    font-family:'Inter',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--teal);
    margin-bottom:18px;
  }
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,4.2vw,36px);
    line-height:1.15;
    margin:0 0 12px;
    color:var(--teal-dark);
  }
  .progress-row{
    display:flex;align-items:center;gap:10px;margin-top:20px;
  }
  .progress-track{
    flex:1;height:6px;border-radius:6px;background:var(--border);overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--teal);border-radius:6px;
    width:0%;transition:width .35s ease;
  }
  .progress-label{font-size:13px;color:var(--ink-soft);white-space:nowrap;font-weight:500;}

  /* RESULTS PANEL */
  .results{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px 24px 20px;
    margin:28px 0 36px;
  }
  .results h2{
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;
    margin:0 0 4px;color:var(--teal-dark);
  }
  .results .hint{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;}
  .origen-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--teal-tint);color:var(--teal-dark);
    border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;
    margin-bottom:18px;
  }
  .profile-hero{
    border-radius:var(--radius-sm);
    padding:20px 22px;
    margin-bottom:22px;
  }
  .profile-hero .eyebrow{
    font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    opacity:.75;margin-bottom:6px;
  }
  .profile-hero h3{
    font-family:'Fraunces',serif;font-weight:700;font-size:24px;margin:0 0 8px;
  }
  .profile-hero p{margin:0;font-size:14.5px;line-height:1.5;}
  .profile-hero.stage-1{background:var(--clay-tint);color:var(--clay);}
  .profile-hero.stage-1 p{color:#7A4230;}
  .profile-hero.stage-2{background:var(--gold-tint);color:#946420;}
  .profile-hero.stage-2 p{color:#7A5419;}
  .profile-hero.stage-3{background:var(--teal-tint);color:var(--teal);}
  .profile-hero.stage-3 p{color:var(--teal-dark);}
  .profile-hero.stage-4{background:var(--teal-dark);color:#fff;}
  .profile-hero.stage-4 p{color:#DCEAE5;}
  .profile-hero.locked{
    background:var(--bg);border:1.5px dashed var(--border);color:var(--ink-soft);
    text-align:center;
  }
  .profile-hero.locked h3{font-size:15px;font-weight:600;color:var(--ink-soft);}
  .profile-hero.locked p{font-size:13.5px;}
  .bar-row{margin-bottom:13px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label-row{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:5px;gap:12px;
  }
  .bar-name{font-size:14px;font-weight:600;color:var(--ink);}
  .bar-level{font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .bar-track{
    height:10px;border-radius:6px;background:var(--bg);
    border:1px solid var(--border);overflow:hidden;
  }
  .bar-fill{
    height:100%;border-radius:6px;width:0%;
    transition:width .4s ease;
  }
  .bar-fill.level-3{background:var(--teal);}
  .bar-fill.level-2{background:var(--gold);}
  .bar-fill.level-1{background:var(--clay);}
  .bar-fill.level-0{background:transparent;}

  .summary-boxes{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;
  }
  @media (max-width:560px){.summary-boxes{grid-template-columns:1fr;}}
  .sbox{border-radius:var(--radius-sm);padding:14px 16px;}
  .sbox.strong{background:var(--teal-tint);}
  .sbox.weak{background:var(--clay-tint);}
  .sbox h3{
    font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;
    margin:0 0 8px;font-weight:700;
  }
  .sbox.strong h3{color:var(--teal-dark);}
  .sbox.weak h3{color:var(--clay);}
  .sbox p{margin:0;font-size:13.5px;color:var(--ink);}
  .sbox .tip{display:block;margin-top:6px;color:var(--ink-soft);font-size:13px;}
  .empty-note{font-size:13.5px;color:var(--ink-soft);font-style:italic;}

  /* QUESTIONS */
  .question{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:14px;
  }
  .q-index{
    font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.06em;
    margin-bottom:8px;
  }
  .q-text{
    font-family:'Fraunces',serif;font-weight:600;font-size:18px;
    color:var(--ink);margin:0 0 14px;line-height:1.35;
  }
  .options{display:flex;flex-direction:column;gap:8px;}
  .option{
    display:flex;align-items:center;gap:10px;
    text-align:left;
    border:1.5px solid var(--border);
    background:var(--bg);
    border-radius:var(--radius-sm);
    padding:11px 14px;
    font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);
    cursor:pointer;transition:border-color .15s ease, background .15s ease;
  }
  .option:hover{border-color:var(--teal);}
  .option .dot{
    width:16px;height:16px;border-radius:50%;
    border:1.5px solid var(--border);flex:0 0 auto;
    background:var(--surface);
    position:relative;
  }
  .option.selected{
    border-color:var(--teal);background:var(--teal-tint);font-weight:600;
  }
  .option.selected .dot{border-color:var(--teal);background:var(--teal);}
  .option.selected .dot::after{
    content:'';position:absolute;inset:3.5px;border-radius:50%;background:var(--surface);
  }

  .actions{
    display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;
  }
  button.primary, button.secondary{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
    border-radius:999px;padding:12px 22px;cursor:pointer;border:none;
  }
  button.primary{background:var(--teal);color:#fff;}
  button.primary:hover{background:var(--teal-dark);}
  button.secondary{background:transparent;color:var(--ink-soft);border:1.5px solid var(--border);}
  button.secondary:hover{border-color:var(--ink-soft);}

  footer.bottom{
    margin-top:40px;padding-top:24px;border-top:1px solid var(--border);
    text-align:center;
  }
  .contact-line{
    display:flex;justify-content:center;flex-wrap:wrap;gap:18px;
    margin-bottom:10px;
  }
  .contact-line a{
    font-size:14px;font-weight:600;color:var(--teal-dark);text-decoration:none;
  }
  .contact-line a:hover{color:var(--teal);}
  .contact-note{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .made-by{font-size:12px;color:var(--ink-soft);margin:0;}

  /* PRINT */
  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .wrap{max-width:100%;padding:0;}
    .question{break-inside:avoid;border-color:#ddd;}
    .results{border-color:#ddd;}
    a[href]::after{content:"";}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand"><span class="dot"></span> CAMEYA</div>
    <h1>Diagnóstico rápido de comunicación y mercadeo</h1>
    <div class="progress-row no-print">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 de 8 respondidas</div>
    </div>
  </header>

  <section class="results" id="resultsPanel">
    <h2>Tu panorama</h2>
    <p class="hint">Se va llenando a medida que respondes abajo.</p>
    <div id="profileHero"></div>
    <div id="origenChip"></div>
    <div id="barsContainer"></div>
    <div class="summary-boxes" id="summaryBoxes"></div>
  </section>

  <div id="questionsContainer"></div>

  <div class="actions no-print">
    <button class="secondary" id="resetBtn">Restablecer respuestas</button>
    <button class="primary" id="printBtn">Descargar / Imprimir diagnóstico</button>
  </div>

  <footer class="bottom">
    <p class="contact-note">¿Quieres profundizar en esto o compartirlo con alguien?</p>
    <div class="contact-line">
      <a href="https://wa.me/573113323828" target="_blank" rel="noopener">WhatsApp</a>
      <a href="mailto:info@cameya.co">info@cameya.co</a>
      <a href="https://instagram.com/cameya.co" target="_blank" rel="noopener">@cameya.co</a>
    </div>
    <p class="made-by">Hecho por Cameya</p>
  </footer>
</div>

<script>
(function(){

  // ---------- Datos ----------
  var QUESTIONS = [
    {
      id:'origen', type:'info',
      text:'¿Por dónde te llegan tus clientes hoy?',
      options:[
        {label:'Redes sociales'},
        {label:'Recomendaciones de boca en boca'},
        {label:'Pauta o publicidad paga'},
        {label:'La verdad no tengo claro'}
      ]
    },
    {
      id:'interaccion', area:'Interacción que se convierte en clientes',
      text:'Tu contenido genera movimiento (likes, comentarios, que te compartan), pero esa gente que interactúa, ¿termina comprando?',
      options:[
        {label:'Sí, la interacción sí se me convierte en clientes', score:3},
        {label:'Tengo bastante movimiento en redes pero pocos compran', score:2},
        {label:'No tengo mucho movimiento todavía, así que no sabría decir', score:1}
      ]
    },
    {
      id:'cierre', area:'Cierre de quienes preguntan',
      text:'Cuando alguien muestra interés (te escribe, pregunta, comenta), ¿qué tanto termina comprando?',
      options:[
        {label:'La mayoría cierra', score:3},
        {label:'Unos cierran, otros se quedan pensándolo', score:2},
        {label:'Casi nadie cierra aunque pregunte harto', score:1}
      ]
    },
    {
      id:'retencion', area:'Clientes que vuelven o refieren',
      text:'¿Tus clientes te refieren y vuelven, o normalmente tienes que estar buscando clientes nuevos todo el tiempo?',
      options:[
        {label:'Me refieren y vuelven seguido', score:3},
        {label:'A veces refieren, pero igual tengo que seguir buscando', score:2},
        {label:'Casi siempre tengo que salir a buscar desde cero', score:1}
      ]
    },
    {
      id:'pauta', area:'Conocimiento de tu inversión en pauta',
      text:'¿Has invertido en publicidad paga alguna vez? Si sí, ¿sabes cuánto te cuesta cada cliente que llega por ahí?',
      options:[
        {label:'Sí he pautado y sé cuánto me cuesta cada cliente', score:3},
        {label:'He pautado, pero no tengo claro cuánto me cuesta cada cliente', score:2},
        {label:'No he pautado todavía', score:1}
      ]
    },
    {
      id:'medicion', area:'Medición de resultados',
      text:'¿Cómo sabes si lo que haces en redes o mercadeo está funcionando?',
      options:[
        {label:'Tengo un número o meta que reviso', score:3},
        {label:'Más o menos sé si va bien, pero no lo mido', score:2},
        {label:'Voy por sensación, no reviso nada en concreto', score:1}
      ]
    },
    {
      id:'propuesta', area:'Claridad de tu propuesta de valor',
      text:'¿Alguien que ve tu perfil por primera vez entiende rápido qué haces y por qué elegirte a ti y no a otro?',
      options:[
        {label:'Sí, creo que se nota claro', score:3},
        {label:'Más o menos, pero no estoy seguro', score:2},
        {label:'La verdad no, publico pero no sé si se entiende qué me hace diferente', score:1}
      ]
    },
    {
      id:'regularidad', area:'Constancia publicando',
      text:'¿Publicas con regularidad o depende del ánimo o el tiempo que tengas esa semana?',
      options:[
        {label:'Tengo una frecuencia que mantengo', score:3},
        {label:'Publico, pero muy irregular', score:2},
        {label:'Casi no publico o solo cuando se me ocurre', score:1}
      ]
    }
  ];

  var TIPS = {
    interaccion:"Agrega siempre una acción clara en tus publicaciones (ej. \"escríbeme al WhatsApp\"). No dejes que la gente solo mire y siga de largo.",
    cierre:"Ten listo un mensaje corto de respuesta rápida para cuando alguien pregunta, y respóndelo el mismo día.",
    retencion:"Después de una venta, escribe a los 15-30 días para saber cómo le fue. Ahí nace el referido.",
    pauta:"Antes de invertir más en pauta, calcula cuánto te cuesta hoy conseguir un cliente sin pautar. Así vas a poder comparar.",
    medicion:"Elige un solo número para revisar cada semana (ej. cuántos mensajes nuevos llegaron). No necesitas más para empezar.",
    propuesta:"Escribe en una frase qué te hace diferente, y úsala igual en todos tus perfiles.",
    regularidad:"Define un número fijo de publicaciones a la semana. Mejor pocas y constantes que muchas y esporádicas."
  };

  var LEVEL_NAME = {3:'Consolidado', 2:'En desarrollo', 1:'Inicial', 0:'Sin responder'};

  var PROFILES = [
    {stage:1, min:7, max:10, name:'En la línea de salida',
     desc:'Vas arrancando. Es normal no tener ritmo todavía. Lo importante ahora es dar el primer paso bien dado, no correr rápido.'},
    {stage:2, min:11, max:14, name:'Tomando impulso',
     desc:'Ya hay movimiento, pero falta que ese esfuerzo se convierta en resultados constantes. Tienes piezas sueltas, todavía no un sistema.'},
    {stage:3, min:15, max:18, name:'En racha',
     desc:'Tienes buen momentum. Hay una o dos cosas puntuales frenándote de dar el salto: arréglalas y el resto empuja solo.'},
    {stage:4, min:19, max:21, name:'Con ritmo de podio',
     desc:'Bases sólidas. El siguiente paso ya no es arreglar lo básico, sino escalar sabiendo que lo que hay detrás funciona.'}
  ];

  var SCORED_IDS = QUESTIONS.filter(function(q){ return q.area; }).map(function(q){ return q.id; });

  function getProfile(total){
    for(var i=0;i<PROFILES.length;i++){
      if(total >= PROFILES[i].min && total <= PROFILES[i].max) return PROFILES[i];
    }
    return null;
  }

  // ---------- Almacenamiento (con respaldo en memoria si falla) ----------
  var memoryStore = {};
  var storageOK = true;
  try{
    var testKey='__cameya_test__';
    localStorage.setItem(testKey,'1');
    localStorage.removeItem(testKey);
  }catch(e){ storageOK = false; }

  function storageGet(key){
    if(storageOK){
      try{ return localStorage.getItem(key); }catch(e){ return memoryStore[key] || null; }
    }
    return memoryStore[key] || null;
  }
  function storageSet(key,val){
    if(storageOK){
      try{ localStorage.setItem(key,val); return; }catch(e){}
    }
    memoryStore[key]=val;
  }
  function storageRemove(key){
    if(storageOK){
      try{ localStorage.removeItem(key); return; }catch(e){}
    }
    delete memoryStore[key];
  }

  var STORAGE_KEY = 'cameya_diagnostico_v1';

  function loadAnswers(){
    var raw = storageGet(STORAGE_KEY);
    if(!raw) return {};
    try{ return JSON.parse(raw); }catch(e){ return {}; }
  }
  function saveAnswers(answers){
    storageSet(STORAGE_KEY, JSON.stringify(answers));
  }

  var answers = loadAnswers();

  // ---------- Render preguntas ----------
  var qContainer = document.getElementById('questionsContainer');

  function renderQuestions(){
    qContainer.innerHTML = '';
    QUESTIONS.forEach(function(q, idx){
      var card = document.createElement('div');
      card.className = 'question';

      var qi = document.createElement('div');
      qi.className = 'q-index';
      qi.textContent = 'Pregunta ' + (idx+1) + ' de ' + QUESTIONS.length;
      card.appendChild(qi);

      var qt = document.createElement('p');
      qt.className = 'q-text';
      qt.textContent = q.text;
      card.appendChild(qt);

      var opts = document.createElement('div');
      opts.className = 'options';

      q.options.forEach(function(opt, oi){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option no-print-hover';
        var isSelected = answers[q.id] === oi;
        if(isSelected) btn.className += ' selected';

        var dot = document.createElement('span');
        dot.className = 'dot';
        btn.appendChild(dot);

        var label = document.createElement('span');
        label.textContent = opt.label;
        btn.appendChild(label);

        btn.addEventListener('click', function(){
          answers[q.id] = oi;
          saveAnswers(answers);
          renderQuestions();
          renderResults();
        });

        opts.appendChild(btn);
      });

      card.appendChild(opts);
      qContainer.appendChild(card);
    });
  }

  // ---------- Render resultados ----------
  var barsContainer = document.getElementById('barsContainer');
  var origenChipEl = document.getElementById('origenChip');
  var summaryBoxesEl = document.getElementById('summaryBoxes');
  var profileHeroEl = document.getElementById('profileHero');
  var progressFill = document.getElementById('progressFill');
  var progressLabel = document.getElementById('progressLabel');

  function renderProfile(){
    var answeredScored = SCORED_IDS.filter(function(id){ return answers[id] !== undefined; });
    profileHeroEl.innerHTML = '';

    if(answeredScored.length < SCORED_IDS.length){
      var missing = SCORED_IDS.length - answeredScored.length;
      var locked = document.createElement('div');
      locked.className = 'profile-hero locked';
      var h3 = document.createElement('h3');
      h3.textContent = 'Tu perfil de carrera se desbloquea al terminar';
      var p = document.createElement('p');
      p.textContent = 'Faltan ' + missing + ' pregunta' + (missing===1?'':'s') + ' para ver en qué etapa vas.';
      locked.appendChild(h3);
      locked.appendChild(p);
      profileHeroEl.appendChild(locked);
      return;
    }

    var total = 0;
    QUESTIONS.forEach(function(q){
      if(!q.area) return;
      total += q.options[answers[q.id]].score;
    });

    var profile = getProfile(total);
    if(!profile) return;

    var hero = document.createElement('div');
    hero.className = 'profile-hero stage-' + profile.stage;
    var eyebrow = document.createElement('div');
    eyebrow.className = 'eyebrow';
    eyebrow.textContent = 'Tu perfil de carrera';
    var h3p = document.createElement('h3');
    h3p.textContent = profile.name;
    var pp = document.createElement('p');
    pp.textContent = profile.desc;
    hero.appendChild(eyebrow);
    hero.appendChild(h3p);
    hero.appendChild(pp);
    profileHeroEl.appendChild(hero);
  }

  function renderResults(){
    renderProfile();
    var answeredCount = Object.keys(answers).length;
    var pct = Math.round((answeredCount/QUESTIONS.length)*100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = answeredCount + ' de ' + QUESTIONS.length + ' respondidas';

    // Chip de origen
    origenChipEl.innerHTML = '';
    if(answers.origen !== undefined){
      var origenQ = QUESTIONS[0];
      var chip = document.createElement('div');
      chip.className = 'origen-chip';
      chip.textContent = 'Te llegan clientes principalmente por: ' + origenQ.options[answers.origen].label.toLowerCase();
      origenChipEl.appendChild(chip);
    }

    // Áreas puntuadas
    var scored = QUESTIONS.filter(function(q){ return q.area; });
    var results = scored.map(function(q){
      var ansIdx = answers[q.id];
      var score = (ansIdx !== undefined) ? q.options[ansIdx].score : 0;
      return {id:q.id, area:q.area, score:score};
    });

    // Ordenar de más fuerte a más débil; sin responder al final
    results.sort(function(a,b){ return b.score - a.score; });

    barsContainer.innerHTML = '';
    results.forEach(function(r){
      var row = document.createElement('div');
      row.className = 'bar-row';

      var labelRow = document.createElement('div');
      labelRow.className = 'bar-label-row';
      var name = document.createElement('span');
      name.className = 'bar-name';
      name.textContent = r.area;
      var level = document.createElement('span');
      level.className = 'bar-level';
      level.textContent = LEVEL_NAME[r.score];
      labelRow.appendChild(name);
      labelRow.appendChild(level);

      var track = document.createElement('div');
      track.className = 'bar-track';
      var fill = document.createElement('div');
      fill.className = 'bar-fill level-' + r.score;
      fill.style.width = (r.score/3*100) + '%';
      track.appendChild(fill);

      row.appendChild(labelRow);
      row.appendChild(track);
      barsContainer.appendChild(row);
    });

    // Cajas de resumen (más fuerte / a trabajar)
    summaryBoxesEl.innerHTML = '';
    var answeredResults = results.filter(function(r){ return r.score > 0; });

    if(answeredResults.length === 0){
      var empty = document.createElement('p');
      empty.className = 'empty-note';
      empty.textContent = 'Responde las preguntas de abajo para ver tu panorama.';
      summaryBoxesEl.appendChild(empty);
      summaryBoxesEl.style.display = 'block';
      return;
    }
    summaryBoxesEl.style.display = 'grid';

    var maxScore = Math.max.apply(null, answeredResults.map(function(r){return r.score;}));
    var minScore = Math.min.apply(null, answeredResults.map(function(r){return r.score;}));

    var strongOnes = answeredResults.filter(function(r){ return r.score === maxScore; });
    var weakOnes = answeredResults.filter(function(r){ return r.score === minScore && minScore < 3; });

    if(strongOnes.length){
      var sbox = document.createElement('div');
      sbox.className = 'sbox strong';
      var h3 = document.createElement('h3');
      h3.textContent = 'Lo más fuerte hoy';
      sbox.appendChild(h3);
      strongOnes.forEach(function(r){
        var p = document.createElement('p');
        p.textContent = r.area;
        sbox.appendChild(p);
      });
      summaryBoxesEl.appendChild(sbox);
    }

    if(weakOnes.length){
      var wbox = document.createElement('div');
      wbox.className = 'sbox weak';
      var h3w = document.createElement('h3');
      h3w.textContent = 'Para trabajar primero';
      wbox.appendChild(h3w);
      weakOnes.forEach(function(r){
        var p = document.createElement('p');
        p.textContent = r.area;
        if(TIPS[r.id]){
          var tip = document.createElement('span');
          tip.className = 'tip';
          tip.textContent = TIPS[r.id];
          p.appendChild(tip);
        }
        wbox.appendChild(p);
      });
      summaryBoxesEl.appendChild(wbox);
    }
  }

  // ---------- Acciones ----------
  document.getElementById('resetBtn').addEventListener('click', function(){
    if(confirm('¿Borrar todas las respuestas y empezar de nuevo?')){
      answers = {};
      storageRemove(STORAGE_KEY);
      renderQuestions();
      renderResults();
    }
  });

  document.getElementById('printBtn').addEventListener('click', function(){
    window.print();
  });

  // ---------- Inicio ----------
  renderQuestions();
  renderResults();

})();
</script>
</body>
</html>
